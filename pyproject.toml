[build-system]
requires = [
    "setuptools>=64",
    # NumPy 2 ships a numpy/__init__.pxd that needs Cython 3. Building against
    # NumPy 2 produces an extension that also runs on NumPy 1.x (>=1.23).
    "numpy>=2.0",
    "Cython>=3.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "arcticpy"
version= "2.5"
description = "This is the python module for the arCTIc code"
authors = [
    { name = "Richard Massey", email = "r.j.massey@durham.ac.uk" }
]
dependencies = [
    "numpy>=1.23",
    "scipy",
    "matplotlib",
]
requires-python = ">=3.8"

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["arcticpy"]
zip-safe = false

[project.optional-dependencies]
pytest = [
    "coverage",
    "pytest",
]
